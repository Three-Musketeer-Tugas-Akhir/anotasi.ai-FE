services:
  anotasi-fe-dev:
    # Use the same base image as your production Dockerfile for consistency
    image: node:20-alpine
    container_name: anotasi-fe-dev
    working_dir: /app
    
    # Map the exposed port to your host
    ports:
      - "3002:3000"
    
    volumes:
      # Mount the current directory directly to /app for live code reloading
      - .:/app
      # Use an anonymous volume for node_modules to avoid cross-OS environment conflicts 
      # (e.g. Linux native modules bindings vs Host OS native modules)
      - /app/node_modules
      # Cache Next.js build artifacts inside the container for faster restarts
      - /app/.next
      
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Enable fallback polling in Next.js (Webpack/Turbopack) to reliably trigger 
      # Fast Refresh (Hot Reload) when mounted files are modified, especially on Docker for Mac/Windows.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      
    # Safely install dependencies (if not present in the anonymous volume) and start the Next.js dev server.
    command: >
      sh -c "npm install && npm run dev"
