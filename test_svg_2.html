<!DOCTYPE html>
<html>
<body>
<div style="margin: 100px; width: 600px; position: relative;">
  <div style="height: 100px; background: #fff; border: 2px solid #ccc; border-radius: 16px;">Box 1</div>
  
  <div style="height: 50px; position: relative; width: 100%;">
    <svg width="100%" height="100%" style="position: absolute; inset: 0; overflow: visible;">
      <defs>
        <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
        </marker>
      </defs>
      <!-- Left curve -->
      <path d="M 0,-20 L -30,-20 Q -40,-20 -40,-10 L -40,60 Q -40,70 -30,70 L -5,70" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-yellow)">
        <animate attributeName="stroke-dashoffset" from="16" to="0" dur="0.8s" repeatCount="indefinite" />
      </path>
    </svg>
  </div>

  <div style="height: 100px; background: #fff; border: 2px solid #ccc; border-radius: 16px;">Box 2</div>
  
  <div style="height: 50px; position: relative; width: 100%;">
    <svg width="100%" height="100%" style="position: absolute; inset: 0; overflow: visible;">
      <defs>
        <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
        </marker>
      </defs>
      <!-- Right curve -->
      <path d="M 600,-20 L 630,-20 Q 640,-20 640,-10 L 640,60 Q 640,70 630,70 L 605,70" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-grey)">
      </path>
    </svg>
  </div>

  <div style="height: 100px; background: #fff; border: 2px solid #ccc; border-radius: 16px;">Box 3</div>

</div>
</body>
</html>
